name: CI/CD

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pillow

      - name: Compile check
        run: python -m compileall -q main.py gui.py engine.py localization.py preset_parser.py vpy_param_widget.py

      - name: Import smoke test
        run: python -c "import PySide6, qfluentwidgets, yaml, PIL; print('imports ok')"

  package:
    name: Package Windows installer
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pillow

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build Nuitka + NSIS package
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
            pwsh -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Version $version
          } else {
            pwsh -NoProfile -ExecutionPolicy Bypass -File .\build.ps1
          }

      - name: Verify package
        shell: pwsh
        run: |
          if (-not (Test-Path outputs\main.dist\FastEmbedSub.exe)) { throw 'FastEmbedSub.exe missing' }
          $installer = Get-ChildItem outputs -Filter 'FastEmbedSub_v*_Setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer missing' }
          Get-FileHash $installer.FullName -Algorithm SHA256

      - name: Create portable 7z archive
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '1.0.1' }
          $archive = "outputs\FastEmbedSub_v${version}_Portable.7z"
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = 'C:\Program Files\7-Zip\7z.exe' }
          if (-not (Test-Path $sevenZip)) { throw '7-Zip executable missing' }
          & $sevenZip a -t7z -mx=9 $archive outputs\main.dist
          if ($LASTEXITCODE -ne 0) { throw "7-Zip failed with exit code $LASTEXITCODE" }
          Get-FileHash $archive -Algorithm SHA256

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: FastEmbedSub-windows-installer
          path: |
            outputs/FastEmbedSub_v*_Setup.exe
            outputs/FastEmbedSub_v*_Portable.7z
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v6
        with:
          name: FastEmbedSub-windows-installer
          path: release-assets

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem release-assets -File
          if (-not $assets) { throw 'Release assets missing' }
          gh release create $env:GITHUB_REF_NAME $assets.FullName --title "FastEmbedSub $env:GITHUB_REF_NAME" --generate-notes
