name: CI/CD

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pillow

      - name: Compile check
        run: python -m compileall -q main.py gui.py engine.py localization.py preset_parser.py vpy_param_widget.py

      - name: Import smoke test
        run: python -c "import PySide6, qfluentwidgets, yaml, PIL; print('imports ok')"

  package:
    name: Package Windows installer
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pillow

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build Nuitka + NSIS package
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\build.ps1

      - name: Verify package
        shell: pwsh
        run: |
          if (-not (Test-Path outputs\main.dist\FastEmbedSub.exe)) { throw 'FastEmbedSub.exe missing' }
          $installer = Get-ChildItem outputs -Filter 'FastEmbedSub_v*_Setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer missing' }
          Get-FileHash $installer.FullName -Algorithm SHA256

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: FastEmbedSub-windows-installer
          path: outputs/FastEmbedSub_v*_Setup.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v6
        with:
          name: FastEmbedSub-windows-installer
          path: release-assets

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem release-assets -Filter 'FastEmbedSub_v*_Setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Release installer missing' }
          gh release create $env:GITHUB_REF_NAME $installer.FullName --title "FastEmbedSub $env:GITHUB_REF_NAME" --generate-notes
