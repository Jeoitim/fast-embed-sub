name: CI/CD

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pillow

      - name: Compile check
        run: python -m compileall -q main.py gui.py engine.py localization.py preset_parser.py vpy_param_widget.py

      - name: Import smoke test
        run: python -c "import PySide6, qfluentwidgets, yaml, PIL; print('imports ok')"

  package:
    name: Package Windows Portable-Core
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pillow

      # VapourSynth components are distributed separately; CI builds only Core.
      - name: Build Portable-Core (skip installer)
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Version $version -SkipInstaller
          if ($LASTEXITCODE -ne 0) { throw "Core build failed with exit code $LASTEXITCODE" }

      - name: Verify package
        shell: pwsh
        run: |
          if (-not (Test-Path outputs\main.dist\FastEmbedSub.exe)) { throw 'FastEmbedSub.exe missing' }
          Get-Item outputs\main.dist\FastEmbedSub.exe | Select-Object FullName,Length

      - name: Create portable 7z archive
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $portableName = "FastEmbedSub_v${version}_Portable-Core"
          $portableDir = Join-Path 'outputs' $portableName
          $archiveName = "${portableName}.7z"
          $archive = Join-Path 'outputs' $archiveName
          if (Test-Path $portableDir) { Remove-Item $portableDir -Recurse -Force }
          New-Item -ItemType Directory -Path $portableDir | Out-Null
          Copy-Item -Path 'outputs\main.dist\*' -Destination $portableDir -Recurse -Force
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = 'C:\Program Files\7-Zip\7z.exe' }
          if (-not (Test-Path $sevenZip)) { throw '7-Zip executable missing' }
          Push-Location outputs
          try {
            & $sevenZip a -t7z -mx=9 $archiveName $portableName
            if ($LASTEXITCODE -ne 0) { throw "7-Zip failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          Remove-Item $portableDir -Recurse -Force
          Get-FileHash $archive -Algorithm SHA256

      - name: Upload Portable-Core artifact
        uses: actions/upload-artifact@v6
        with:
          name: FastEmbedSub-windows-portable-core
          path: |
            outputs/FastEmbedSub_v*_Portable-Core.7z
          if-no-files-found: error
