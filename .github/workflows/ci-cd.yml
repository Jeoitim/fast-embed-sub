name: CI/CD

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish, for example v1.0.1"
        required: true
        default: "v1.0.1"
        type: string

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pillow

      - name: Compile check
        run: python -m compileall -q main.py gui.py engine.py localization.py preset_parser.py vpy_param_widget.py

      - name: Import smoke test
        run: python -c "import PySide6, qfluentwidgets, yaml, PIL; print('imports ok')"

  package:
    name: Package Windows installer
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')))
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pillow

      # build.ps1 currently requires NSIS even when the CI artifact is Portable-Core.
      # The generated installer is intentionally not uploaded or released by CI.
      - name: Install NSIS (build script prerequisite)
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build Nuitka + NSIS package
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = '${{ inputs.release_tag }}'.TrimStart('v')
            pwsh -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Version $version
          } elseif ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
            pwsh -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Version $version
          } else {
            pwsh -NoProfile -ExecutionPolicy Bypass -File .\build.ps1
          }

      - name: Verify package
        shell: pwsh
        run: |
          if (-not (Test-Path outputs\main.dist\FastEmbedSub.exe)) { throw 'FastEmbedSub.exe missing' }
          Get-Item outputs\main.dist\FastEmbedSub.exe | Select-Object FullName,Length

      - name: Create portable 7z archive
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = '${{ inputs.release_tag }}'.TrimStart('v')
          } elseif ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = '1.0.1'
          }
          $portableName = "FastEmbedSub_v${version}_Portable-Core"
          $portableDir = Join-Path 'outputs' $portableName
          $archiveName = "${portableName}.7z"
          $archive = Join-Path 'outputs' $archiveName
          if (Test-Path $portableDir) { Remove-Item $portableDir -Recurse -Force }
          New-Item -ItemType Directory -Path $portableDir | Out-Null
          Copy-Item -Path 'outputs\main.dist\*' -Destination $portableDir -Recurse -Force
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = 'C:\Program Files\7-Zip\7z.exe' }
          if (-not (Test-Path $sevenZip)) { throw '7-Zip executable missing' }
          Push-Location outputs
          try {
            & $sevenZip a -t7z -mx=9 $archiveName $portableName
            if ($LASTEXITCODE -ne 0) { throw "7-Zip failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          Remove-Item $portableDir -Recurse -Force
          Get-FileHash $archive -Algorithm SHA256

      - name: Upload Portable-Core artifact
        uses: actions/upload-artifact@v6
        with:
          name: FastEmbedSub-windows-portable-core
          path: |
            outputs/FastEmbedSub_v*_Portable-Core.7z
          if-no-files-found: error
